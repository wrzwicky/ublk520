# Install as /etc/systemd/system/ublk520.service.d/zfs.conf
# Replace "tank" with your pool name. Unit names vary by distro: check `systemctl list-units 'zfs*'`.
[Unit]
# Start the shim before ZFS tries to import pools from the cache file or by scanning.
Before=zfs-import-cache.service zfs-import-scan.service zfs-import.target
# Don't take the whole shim down at boot just because a pool fails to import.
# (No Requires= from zfs units to us is needed; ordering is enough.)

[Service]
# At shutdown systemd stops ZFS units first, then runs this, then SIGTERMs the shim.
# Exporting the pool first means ZFS never sees its disk vanish. "-" ignores failure (e.g. pool busy).
ExecStop=-/usr/sbin/zpool export tank
TimeoutStopSec=300
